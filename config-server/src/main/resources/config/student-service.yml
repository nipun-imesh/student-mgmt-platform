server:
  port: 8081

spring:
  application:
    name: student-service
  datasource:
    url: jdbc:mysql://<cloud-sql-private-ip>:3306/student_db
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  cloud:
    gcp:
      storage:
        bucket: student-mgmt-documents-${GCP_PROJECT_ID}
